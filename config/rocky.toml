# Rocky Walker: single source of truth for geometry, servos and gait.
# Human units here (mm, degrees, kg, kg·cm, deg/s); rocky.config converts everything to SI.
# Values marked "provisional" are tuned in simulation (milestone M1) before printing.

[body]
n_legs = 5              # only 5 is supported
mount_radius_mm = 100   # wide body: body centre -> coxa axis (was 70 in the stacked design)
thickness_mm = 59.7    # wide body: chassis tub floor-to-eave height from the Fusion body (was 32 stacked)

[mass]                  # M2: measured from the Fusion design (cad/reports/mass.json)
total_kg = 2.175        # wide body + measured servo/horn sizes (cad/reports/mass.json)
coxa_link_kg = 0.0889   # coxa bracket + femur servo + horn + bearing
femur_link_kg = 0.0900  # femur + knee servo + horn + bearing
tibia_link_kg = 0.0335  # tibia + TPU foot cap + horn + bearing
coxa_link_com_mm = 34.1   # along the segment from its proximal joint axis
femur_link_com_mm = 49.5
tibia_link_com_mm = 32.0

[leg]                   # frozen at M1 (sim torque log, build log 01)
coxa_mm = 40
femur_mm = 70
tibia_mm = 100

[limits]
coxa_deg = [-45, 45]
femur_deg = [-40, 40]     # M2: physical clear range from the Fusion leg (was [-60, 90])
tibia_deg = [-135, -20]   # M2: physical clear range from the Fusion leg (was [-150, -20])

[servo]                 # MG996R at 6 V
stall_torque_kgcm = 11.0
max_speed_dps = 400
torque_rule_kgcm = 5.0  # sustained-torque budget per joint (design doc §6.3)

[gait]
default = "wave"
period_s = 1.5
body_height_mm = 100
stance_radius_mm = 195   # mount radius + 95: same leg pose as the M1-frozen 70 / 165
step_height_mm = 30
max_stride_mm = 60

[gait.duty_factor]
wave = 0.8
star = 0.6

[motion]
loop_hz = 100
max_linear_accel_mps2 = 0.15   # gentler start/reversal keeps feet inside the joint limits
max_angular_accel_dps2 = 45
