[project]
name = "rocky"
version = "0.1.0"
description = "Rocky Walker: an open-source, five-legged, radially symmetric walking robot (fan project)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "mujoco>=3.3",
]

[project.optional-dependencies]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: runs the MuJoCo simulation (slower)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
